name: Scheduled Pipeline Refresh (Daily - Every 24h)

on:
  schedule:
    # Runs at 00:00 UTC every day (every 24 hours)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [main]
    paths-ignore:
      - 'README*.md'
      - '.gitignore'

concurrency:
  group: refresh-pipeline
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push updated data back to repository
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-pipeline.txt

      - name: Step 1 - Scrape News Feeds
        run: python scraper.py

      - name: Step 2 - Analyze Articles with Gemini LLM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python analyzer.py

      - name: Step 3 - Cluster Articles by Event
        run: python clusterer.py --eps 0.40

      - name: Step 4 - Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json analyzed.json clustered.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-refresh news data [skip ci]"
            git push
          fi
